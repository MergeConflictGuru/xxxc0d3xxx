plugins { id 'com.android.application' }
android {
    namespace 'local.dictationrelay'
    compileSdk 35
    defaultConfig { applicationId 'local.dictationrelay'; minSdk 26; targetSdk 35; versionCode 26; versionName '2.6.17' }
    ndkVersion '27.0.12077973'
    externalNativeBuild { cmake { path '../../native/CMakeLists.txt'; version '3.22.1'; buildStagingDirectory '../../.app_tmp/android-native' } }
    defaultConfig { ndk { abiFilters 'arm64-v8a' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.zxing:core:3.5.3'; implementation 'org.java-websocket:Java-WebSocket:1.6.0'; testImplementation 'junit:junit:4.13.2' }
